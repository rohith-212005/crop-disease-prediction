<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhytoScan - Contact Us</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body {
    background: linear-gradient(135deg, #020617 0%, #081c15 100%);
    color: white;
    min-height: 100vh;
}
nav {
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 60px;
    background: rgba(2, 6, 23, 0.6);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    position: sticky; top: 0; z-index: 100;
}
.logo { font-size:24px; font-weight:600; color:#4ade80; text-decoration:none; }
nav ul { display:flex; gap:30px; list-style:none; align-items: center; }
nav a { color:#e2e8f0; text-decoration:none; transition: color 0.3s; font-weight: 400; }
nav a:hover { color:#4ade80; }
.active { color:#4ade80; font-weight: 600; }
.login-btn { background:#22c55e; padding:8px 20px; border-radius:25px; color:#0f172a; font-weight: 600; transition: background 0.3s, transform 0.2s; }
.login-btn:hover { background:#16a34a; color: white; transform: translateY(-2px); }

.contact-container {
    max-width: 800px;
    margin: 60px auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.header { text-align: center; margin-bottom: 40px; }
.header h1 { font-size: 42px; color: #4ade80; margin-bottom: 15px; }
.header p { color: #94a3b8; font-size: 18px; }

.contact-form {
    width: 100%;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    padding: 40px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.form-group {
    margin-bottom: 25px;
}
.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
    font-size: 14px;
}
.form-group input, .form-group textarea {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: white;
    font-size: 16px;
    transition: border-color 0.3s, outline 0.3s;
}
.form-group input:focus, .form-group textarea:focus {
    border-color: #4ade80;
    outline: none;
    box-shadow: 0 0 10px rgba(74, 222, 128, 0.2);
}

.submit-btn {
    width: 100%;
    background: #22c55e;
    color: #0f172a;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}
.submit-btn:hover {
    background: #16a34a;
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(34, 197, 94, 0.3);
}

</style>
</head>
<body>

<nav>
    <a href="/" class="logo">🌿 PhytoScan</a>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/crop">Crop Planner</a></li>
        <!-- MARKET PRICE FEATURE START -->
        <li><a href="/market">Market Price</a></li>
        <!-- MARKET PRICE FEATURE END -->
        <li><a href="/store">Store</a></li>
        <li><a href="/contact" class="active">Contact</a></li>
        <li><a class="login-btn" href="/login">Login</a></li>
    </ul>
</nav>

<div class="contact-container">
    <div class="header">
        <h1>Get in Touch</h1>
        <p>Have questions about your crops? We are here to help.</p>
    </div>

    <form class="contact-form" action="/" method="GET" onsubmit="alert('Thank you for contacting us! We will get back to you soon.');">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="john@example.com" required>
        </div>
        <div class="form-group">
            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="5" placeholder="How can we help you?" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Message</button>
    </form>
</div>

</body>
</html>

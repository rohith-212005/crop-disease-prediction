<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PhytoScan</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #081c15;
            color: white;
        }

        /* NAVBAR */

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 60px;
            background: #020617;
        }

        .logo {
            font-size: 22px;
            font-weight: 600;
            color: #4ade80;
        }

        /* LOGIN SECTION */

        .login-section {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }

        .login-box {
            background: #0b2e1f;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 20px;
            color: #4ade80;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            outline: none;
        }

        .login-btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: #22c55e;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #16a34a;
        }

        p {
            margin-top: 15px;
        }

        a {
            color: #4ade80;
            text-decoration: none;
        }
    </style>

</head>

<body>

    <nav>
        <div class="logo">🌿 PhytoScan</div>
    </nav>

    <!-- LOGIN FORM -->
    <section class="login-section">

        <div class="login-box">

            <h1>Login</h1>

            <form action="/" method="get">

                <input type="text" placeholder="Username" name="username" required>

                <input type="password" placeholder="Password" name="password" required>

                <br><br>

                <label>
                    <input type="checkbox"> Remember me
                </label>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <p>Don't have an account? <a href="register.html">Register</a></p>

        </div>

    </section>

</body>

</html>

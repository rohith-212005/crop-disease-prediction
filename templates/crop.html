<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crop Planner</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background: linear-gradient(135deg, #020617 0%, #081c15 100%);
color: white;
min-height: 100vh;
}

/* NAVBAR */

nav {
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 60px;
    background: rgba(2, 6, 23, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    position: sticky; top: 0; z-index: 100;
}
.logo { font-size:24px; font-weight:600; color:#4ade80; text-decoration:none; }
nav ul { display:flex; gap:30px; list-style:none; align-items: center; margin:0; padding:0;}
nav a { color:#e2e8f0; text-decoration:none; transition: color 0.3s; font-weight: 400; }
nav a:hover { color:#4ade80; }
.active { color:#4ade80; font-weight: 600; }
.login-btn { background:#22c55e; padding:8px 20px; border-radius:25px; color:#0f172a; font-weight: 600; transition: background 0.3s, transform 0.2s; }
.login-btn:hover { background:#16a34a; color: white; transform: translateY(-2px); }

/* HERO */

.hero{
text-align:center;
margin-top:40px;
}

.hero h1{
font-size:40px;
color:#4ade80;
}

.hero p{
margin-top:10px;
opacity:0.8;
}

/* FORM SECTION */

.form-section{
margin-top:50px;
display:flex;
justify-content:center;
}

.form-box{
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.05);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
box-shadow: 0 10px 40px rgba(0,0,0,0.3);
padding:40px;
border-radius:20px;
width:450px;
text-align:center;
}

.form-box input,
.form-box textarea{
width:100%;
padding:10px;
margin-top:10px;
margin-bottom:15px;
border-radius:8px;
border: 1px solid rgba(255,255,255,0.1);
background: rgba(0,0,0,0.2);
color: white;
}

button{
margin-top:10px;
padding:12px 30px;
border:none;
border-radius:25px;
background:#22c55e;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<!-- NAVBAR -->

<nav>
    <a href="/" class="logo">🌿 PhytoScan</a>
    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/crop" class="active">Crop Planner</a></li>
        <!-- MARKET PRICE FEATURE START -->
        <li><a href="/market">Market Price</a></li>
        <!-- MARKET PRICE FEATURE END -->
        <li><a href="/store">Store</a></li>
        <li><a href="/contact">Contact</a></li>
        <li><a class="login-btn" href="/login">Login</a></li>
    </ul>
</nav>

<!-- HERO -->

<section class="hero">

<h1 id="cropTitle">Advanced Crop Planner</h1>

<p>Enter your farm details and get the best crop recommendation.</p>

</section>

<!-- FORM -->

<section class="form-section">

<div class="form-box">

<h2>Find Your Ideal Crop</h2>

<form action="/recommend_crop" method="post">

<input type="text" name="location" placeholder="Farm Location (e.g. Anantapur)" required>

<textarea name="resources" placeholder="Available resources (soil type, irrigation etc)"></textarea>

<input type="number" name="land" placeholder="Land Size (Acres)">

<input type="text" name="last_crop" placeholder="Last Season Crop">

<button type="submit">Get Crop Suggestion</button>

</form>

</div>

</section>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PhytoScan - Crop Detection</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background: linear-gradient(135deg, #020617 0%, #081c15 100%);
color: white;
min-height: 100vh;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 60px;
background: rgba(2, 6, 23, 0.6);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
border-bottom: 1px solid rgba(255, 255, 255, 0.1);
position: sticky; top: 0; z-index: 100;
}

.logo{
font-size:24px;
font-weight:600;
color:#4ade80;
text-decoration: none;
}

nav ul{
display:flex;
gap:30px;
list-style:none;
align-items: center;
}

nav a{
color:#e2e8f0;
text-decoration:none;
transition: color 0.3s;
font-weight: 400;
}
nav a:hover { color:#4ade80; }
.active { color:#4ade80; font-weight: 600; }

.login-btn{
background:#22c55e;
padding:8px 20px;
border-radius:25px;
color:#0f172a;
font-weight: 600;
transition: background 0.3s, transform 0.2s;
}
.login-btn:hover { background:#16a34a; color: white; transform: translateY(-2px); }

/* LANGUAGE */

.language{
text-align:right;
padding:10px 60px;
}

select{
padding:6px 10px;
border-radius:8px;
}

/* HERO */

.hero{
text-align:center;
margin-top:40px;
}

.hero h1{
font-size:40px;
color:#4ade80;
}

.hero p{
margin-top:10px;
opacity:0.8;
}

/* UPLOAD */

.upload-section{
margin-top:50px;
display:flex;
justify-content:center;
}

.upload-box{
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.05);
padding:40px;
border-radius:20px;
text-align:center;
width:400px;
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.upload-box input{
margin-top:20px;
}

button{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:25px;
background:#22c55e;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<nav>

<a href="/" class="logo">🌿 PhytoScan</a>

<ul>
        <li><a href="/" class="active">Home</a></li>
        <li><a href="/crop">Crop Planner</a></li>
        <!-- MARKET PRICE FEATURE START -->
        <li><a href="/market">Market Price</a></li>
        <!-- MARKET PRICE FEATURE END -->
        <li><a href="/store">Store</a></li>
        <li><a href="/contact">Contact</a></li>
        <li><a class="login-btn" href="/login">Login</a></li>
</ul>

</nav>

<div class="language">
<select onchange="changeLanguage(this.value)">
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="te">Telugu</option>
<option value="ta">Tamil</option>
</select>
</div>

<section class="hero">

<h1 id="title">Detect Crop Diseases Instantly</h1>


<p id="subtitle">Upload a leaf image and our AI will identify the disease.</p>

</section>

<section class="upload-section">

<div class="upload-box">

<h2 id="uploadText">Upload Leaf Image</h2>

<form action="/predict" method="post" enctype="multipart/form-data">

<input type="file" name="image" accept="image/*" onchange="previewImage(event)" required>

<br><br>

<img id="preview" src="" style="display:none;width:220px;border-radius:10px;">

<br>

<button id="analyzeBtn" type="submit">Analyze</button>

</form>

</div>

</section>

<script>

function previewImage(event){

const reader = new FileReader();

reader.onload = function(){

const preview = document.getElementById("preview");

preview.src = reader.result;

preview.style.display = "block";

}

reader.readAsDataURL(event.target.files[0]);

}

</script>

<script>

function changeLanguage(lang){

const translations = {

en:{
title:"Detect Crop Diseases Instantly",
subtitle:"Upload a leaf image and our AI will identify the disease.",
upload:"Upload Leaf Image",
analyze:"Analyze"
},

hi:{
title:"फसल रोग तुरंत पहचानें",
subtitle:"पत्ती की तस्वीर अपलोड करें और हमारा AI रोग बताएगा",
upload:"पत्ती की छवि अपलोड करें",
analyze:"विश्लेषण करें"
},

te:{
title:"పంట వ్యాధులను వెంటనే గుర్తించండి",
subtitle:"ఆకు చిత్రాన్ని అప్లోడ్ చేయండి, AI వ్యాధిని గుర్తిస్తుంది",
upload:"ఆకు చిత్రాన్ని అప్లోడ్ చేయండి",
analyze:"విశ్లేషించండి"
},

ta:{
title:"பயிர் நோய்களை உடனே கண்டறியவும்",
subtitle:"இலை படத்தை பதிவேற்றவும், AI நோயை கண்டறியும்",
upload:"இலை படத்தை பதிவேற்றவும்",
analyze:"பகுப்பாய்வு"
}

};

document.getElementById("title").innerText = translations[lang].title;
document.getElementById("subtitle").innerText = translations[lang].subtitle;
document.getElementById("uploadText").innerText = translations[lang].upload;
document.getElementById("analyzeBtn").innerText = translations[lang].analyze;

}

</script>

</body>
</html>
